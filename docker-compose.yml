services:
  jekyll:
    image: jekyll/jekyll:pages
    command: sh -c "(bundle check || bundle install) && exec bundle exec jekyll serve --host 0.0.0.0 --watch --force_polling"
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle

volumes:
  bundle_cache:
